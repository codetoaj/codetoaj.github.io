<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Page Not Found — Amalan Jenicious F</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="This page does not exist. Return to Amalan Jenicious F's portfolio.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --grad: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f6f8fb;
          --card: #ffffff;
          --border: #dce4ee;
          --text: #101a2e;
          --muted: #5b6b82;
          --accent: #0284c7;
          --shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 48px 40px;
        max-width: 420px;
        box-shadow: var(--shadow);
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      h1 {
        font-size: 1.4rem;
        margin: 12px 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        background: var(--grad);
        color: #0f172a;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 999px;
        transition: transform 0.15s ease;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Back to Home</a>
    </div>
  </body>
</html>
